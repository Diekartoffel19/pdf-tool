[package]
name = "pdf-toolkit-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pdf-toolkit"
path = "src/main.rs"

[[bin]]
name = "pdf-toolkit-installer"
path = "src/installer.rs"

[dependencies]
tiny_http = "0.12"
lopdf = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
