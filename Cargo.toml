[package]
name = "pdf-toolkit-rust"
version = "1.0.0"
edition = "2024"
authors = ["PDF Toolkit"]
description = "Native Rust PDF Werkzeugkasten Desktop Application"

[dependencies]
eframe = "0.31"
lopdf = { version = "0.38", features = ["embed_image"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
